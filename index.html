<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='0.75' y='0.75' width='26.5' height='26.5' fill='none' stroke='%231A1A1A' stroke-width='1.5'/%3E%3Cpath d='M0.75 8.5h26.5M16 8.5v18.75M4 18.5h8.5M4 22h6' fill='none' stroke='%231A1A1A' stroke-width='1.5'/%3E%3Crect x='4' y='12' width='8.5' height='3' fill='%23D94F2B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <p>
      <svg class="mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="0.75" y="0.75" width="26.5" height="26.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M0.75 8.5h26.5M16 8.5v18.75M4 18.5h8.5M4 22h6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="12" width="8.5" height="3" fill="#D94F2B"/></svg>
      <strong id="app-name"></strong> <span id="app-tagline"></span>
    </p>
    <div class="project-tools">
      <button type="button" id="undo-btn" disabled>Undo</button>
      <button type="button" id="redo-btn" disabled>Redo</button>
      <button type="button" id="export-btn">Save project file</button>
      <button type="button" id="import-btn">Open project file</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button type="button" id="reset-btn">Start over</button>
    </div>
    <p class="error" id="project-error" hidden></p>
  </header>
  <div class="builder">
    <nav id="rail" aria-label="All steps"></nav>
    <main id="wizard"></main>
    <aside class="preview" aria-label="Live preview">
      <div class="preview-bar"><span class="preview-label">Preview</span><div id="preview-devices"></div><button type="button" class="chip" id="fullscreen-btn">Full screen</button></div>
      <p class="proof-bar"><span id="proof-file"></span><span id="proof-width"></span></p>
      <div id="preview-stage"><iframe id="preview-frame" title="Live preview of your site" sandbox="allow-scripts"></iframe></div>
    </aside>
  </div>
  <footer id="app-footer"></footer>
  <script src="js/utils.js"></script>
  <script>
    document.title = APP_NAME + " - " + APP_TAGLINE;
    document.getElementById("app-name").textContent = APP_NAME;
    document.getElementById("app-tagline").textContent = APP_TAGLINE;
    document.getElementById("app-footer").textContent = APP_NAME + " / 50 templates / no server needed / works offline";
  </script>
  <script src="js/themes.js"></script>
  <script src="js/fontdata.js"></script>
  <script src="js/sitebase.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/layouts.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/lib/jszip.min.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/export.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
