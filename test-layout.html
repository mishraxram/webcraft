<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout test</title>
  <style>
    body { margin: 16px; font-family: sans-serif; }
    iframe { display: block; width: 100%; height: 80vh; margin-top: 8px; border: 1px solid #1A1A1A; }
  </style>
</head>
<body>
  <label>Template <select id="pick"></select></label>
  <iframe id="frame" title="Template preview"></iframe>

  <script src="js/utils.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/fontdata.js"></script>
  <script src="js/sitebase.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/layouts.js"></script>
  <script src="js/templates.js"></script>
  <script>
    const state = {
      siteName: "Asha Rao", siteType: "portfolio", templateId: "", themeId: "", fontStyle: "",
      menuItems: ["Home", "About", "Projects", "Contact"],
      heroTitle: "<script>alert(1)<\/script> I build small, fast websites",
      heroText: "Final-year B.Tech student. I like plain HTML and clear design.",
      about: "I study computer science in Pune. I have built sites for two local shops and my college fest.",
      cards: [
        { title: "Fest website", detail: "Schedule and registration page for 2,000 students." },
        { title: "Bakery menu", detail: "One-page menu with prices and a WhatsApp order button." },
        { title: "Notes app", detail: "Offline notes saved in the browser." }
      ],
      contact: { email: "asha@example.com", phone: "+91 98765 43210", whatsapp: "+91 98765 43210", address: "Pune, India" },
      footer: "Asha Rao, 2026",
      social: { instagram: "", linkedin: "https://linkedin.com/in/asha", github: "javascript:alert(1)" },
      seo: { title: "Asha Rao, web developer", description: "Portfolio of Asha Rao." }
    };

    const pick = document.getElementById("pick");
    const frame = document.getElementById("frame");
    TEMPLATES.forEach(template => pick.append(new Option(template.name, template.id)));

    function show() {
      frame.srcdoc = TEMPLATES.find(template => template.id === pick.value).build(state);
    }
    pick.onchange = show;
    show();
  </script>
</body>
</html>
